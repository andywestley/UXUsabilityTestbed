name: Deploy UX Usability Testbed to Plesk VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Plesk Linux VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via Rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvO --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SSH_HOST || secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER || secrets.SERVER_USERNAME }}
          TARGET: ${{ secrets.SSH_TARGET_DIR || secrets.SERVER_TARGET_DIR || secrets.PLESK_DEPLOY_PATH }}
          EXCLUDE: "/.git/, /.github/, /README.md"
